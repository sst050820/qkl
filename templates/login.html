{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>用户登录</h2>
  <p>请选择账号登录，不同身份拥有不同的权限。</p>
  <form method="post">
    <label>用户名</label>
    <input type="text" name="username" placeholder="例如 admin / donor / recipient" required />
    <label>密码</label>
    <input type="password" name="password" placeholder="请输入密码" required />
    <input type="hidden" name="next" value="{{ next }}" />
    <input type="submit" value="登录" />
  </form>
  <div class="helper-text" style="margin-top: 16px;">
    <p>示例账号：</p>
    <p>管理员：admin / admin123</p>
    <p>捐赠方：donor / donor123</p>
    <p>受赠方：recipient / recipient123</p>
  </div>
</div>
{% endblock %}
