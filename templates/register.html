{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>用户注册</h2>
  <p>注册后会自动登录并进入个人主页。</p>
  <form method="post">
    <label>用户名</label>
    <input type="text" name="username" placeholder="请设置一个用户名" required />
    <label>密码</label>
    <input type="password" name="password" placeholder="设置密码" required />
    <label>确认密码</label>
    <input type="password" name="confirm_password" placeholder="再次输入密码" required />
    <label>身份角色</label>
    <select name="role">
      <option value="donor">捐赠方</option>
      <option value="recipient">受赠方</option>
    </select>
    <input type="submit" value="立即注册" />
  </form>
  <div class="helper-text" style="margin-top: 16px;">
    <p>已有账号？<a href="{{ url_for('login') }}">返回登录</a></p>
  </div>
</div>
{% endblock %}
