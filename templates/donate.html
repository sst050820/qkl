{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>捐赠登记</h2>
  <p>请填写捐赠信息并上传物品照片，系统会生成唯一溯源码用于后续验收与签收。</p>
  <form method="post" enctype="multipart/form-data">
    <label>捐赠者姓名</label>
    <input type="text" name="donor_name" placeholder="填写真实姓名或匿名" />
    <label>联系方式</label>
    <input type="text" name="phone" placeholder="联系电话（仅链下保存）" />
    <label>物品类别</label>
    <select name="item_type">
      <option>衣物</option>
      <option>图书</option>
      <option>生活用品</option>
      <option>综合捐赠</option>
    </select>
    <label>新旧程度</label>
    <select name="condition">
      <option>全新</option>
      <option>轻微使用</option>
      <option>九成新</option>
      <option>正常可用</option>
    </select>
    <label>上传物品照片</label>
    <input type="file" name="photo" accept="image/*" />
    <img id="photo-preview" class="preview-image" src="#" alt="预览图片" style="display:none;" />
    <input type="submit" value="提交捐赠" />
  </form>
</div>
{% endblock %}
