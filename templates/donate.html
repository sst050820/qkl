{% extends 'base.html' %}
{% block content %}

<div class="card" style="max-width:600px;">
  <div class="page-header">
    <div>
      <h2>捐赠登记</h2>
      <p>填写物品信息并上传照片，系统将生成唯一溯源码用于后续全流程追踪。</p>
    </div>
  </div>

  <p><a href="{{ url_for('user_portal') }}" class="action-link">← 返回用户入口</a></p>

  <form method="post" enctype="multipart/form-data" style="margin-top:16px;">
    <label>捐赠者姓名</label>
    <input type="text" name="donor_name" placeholder="填写真实姓名或输入"匿名"" />

    <label>联系方式</label>
    <input type="text" name="phone" placeholder="联系电话（仅链下保存，不对外展示）" />

    <label>物品类别</label>
    <select name="item_type">
      <option>衣物</option>
      <option>图书</option>
      <option>生活用品</option>
      <option>综合捐赠</option>
    </select>

    <label>新旧程度</label>
    <select name="condition">
      <option>全新</option>
      <option>轻微使用</option>
      <option>九成新</option>
      <option>正常可用</option>
    </select>

    <label>物品照片</label>
    <input type="file" name="photo" accept="image/*" />
    <p class="helper-text">支持 PNG / JPG / GIF，建议上传清晰实物照片（≤ 5 MB）</p>
    <img id="photo-preview" class="preview-image" src="#" alt="预览图片"
         style="display:none; margin-top:10px; max-width:200px;" />

    <div style="margin-top:22px;">
      <input type="submit" value="提交捐赠" />
    </div>
  </form>
</div>

{% endblock %}
